name: Deploy CV to Pages + build PDF
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh top-repos block
        run: python3 scripts/update_repos.py index.html
      - name: Commit refreshed block if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: refresh top repositories"
            git push
          fi
      - name: Print CV to PDF (headless Chrome)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser >/dev/null 2>&1 || true
          chromium --headless --disable-gpu --no-sandbox \
            --print-to-pdf=marco-tevar-cv.pdf --no-pdf-header-footer \
            "file://$GITHUB_WORKSPACE/index.html"
      - name: Fail if CV runs past 3 A4 pages
        run: |
          pages=$(pdfinfo marco-tevar-cv.pdf | awk '/^Pages/{print $2}')
          echo "PDF pages: $pages"
          if [ "$pages" -gt 3 ]; then echo "CV too long"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
